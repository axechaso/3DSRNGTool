name: CI

on: [pull_request, push]

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install .NET Framework 4.5.2 reference assemblies
        run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net452 -Version 1.0.3 -OutputDirectory packages -NonInteractive

      - name: Build 3DSRNGTool
        run: msbuild 3DSRNGTool.sln /p:Configuration=Release "/p:TargetFrameworkRootPath=$PWD\packages\Microsoft.NETFramework.ReferenceAssemblies.net452.1.0.3\build" /verbosity:minimal /nologo

      - name: Check encounter tables
        run: .\Tests\EncounterTables\bin\Release\EncounterTables.Tests.exe

      - name: Check Gen6 timeline and TinyMT index predictions
        run: .\Tests\Gen6\bin\Release\Gen6.Tests.exe

      - name: Package 3DSRNGTool
        run: |
          New-Item -ItemType Directory -Force upload\3DSRNGTool | Out-Null
          Copy-Item 3DSRNGTool\bin\Release\* upload\3DSRNGTool -Exclude *.pdb
          Copy-Item LICENSE upload\3DSRNGTool
          Copy-Item Tests\Gen6\README.md upload\3DSRNGTool\G6-README.md
          Copy-Item Tests\EncounterTables\README.md upload\3DSRNGTool\USUM-README.md
          Copy-Item licenses upload\3DSRNGTool\licenses -Recurse
          New-Item -ItemType Directory -Force upload\3DSRNGTool\licenses\TinyFinder | Out-Null
          Copy-Item ThirdParty\TinyFinder\UPSTREAM.md, ThirdParty\TinyFinder\README.md, ThirdParty\TinyFinder\Notes.md, 'ThirdParty\TinyFinder\MT LISENCE.txt', 'ThirdParty\TinyFinder\TinyMT LICENSE.txt' upload\3DSRNGTool\licenses\TinyFinder

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3DSRNGTool
          path: upload
